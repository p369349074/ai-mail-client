services:
  - type: web
    name: ai-mail-client-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DEFAULT_USER_EMAIL
        value: local@example.invalid
      - key: DEFAULT_USER_DISPLAY_NAME
        value: Local User
      - key: MAIL_CONNECT_TIMEOUT_SECONDS
        value: "10"
