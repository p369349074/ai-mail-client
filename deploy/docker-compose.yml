services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_mail
      POSTGRES_USER: ai_mail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_mail -d ai_mail"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ai_mail:${POSTGRES_PASSWORD:-change-me}@postgres:5432/ai_mail
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SECRET_KEY: ${SECRET_KEY:-change-me}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
