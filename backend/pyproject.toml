[project]
name = "ai-mail-client-backend"
version = "0.1.0"
description = "Lightweight API-first mail client backend"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.111.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.29",
    "uvicorn[standard]>=0.29.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:langsmith"]

[tool.uv]
package = false
